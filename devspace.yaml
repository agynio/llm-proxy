version: v2beta1

vars:
  LLM_PROXY_NAMESPACE: platform

functions:
  disable_argocd_sync: |-
    if kubectl get application llm-proxy -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for llm-proxy..."
      kubectl patch application llm-proxy -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'llm-proxy' not found in argocd namespace."
    fi
  restore_argocd_sync: &restore_argocd_sync |-
    if kubectl get application llm-proxy -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for llm-proxy..."
      kubectl patch application llm-proxy -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'llm-proxy' not found in argocd namespace."
    fi
  patch_deployment: |-
    echo "Patching llm-proxy deployment for DevSpace..."
    kubectl patch deployment llm-proxy-llm-proxy -n ${LLM_PROXY_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      replicas: 1
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: devspace-start
              emptyDir: {}
            - name: data
              emptyDir: {}
          containers:
            - name: llm-proxy
              image: ghcr.io/agynio/devcontainer-go:1 # dev container for source deploy
              workingDir: /opt/app/data
              command:
                - sleep
                - infinity
              volumeMounts:
                - name: devspace-start
                  mountPath: /.devspace
                - name: data
                  mountPath: /opt/app/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              livenessProbe:
                tcpSocket: null
                httpGet: null
                exec:
                  command: ["true"]
              readinessProbe:
                tcpSocket: null
                httpGet: null
                exec:
                  command: ["true"]
              startupProbe: null
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"
    kubectl set env deployment/llm-proxy-llm-proxy -n ${LLM_PROXY_NAMESPACE} ZITI_ENABLED=false
  wait_for_source_deployment: |-
    exec_container \
      --label-selector=app.kubernetes.io/name=llm-proxy,app.kubernetes.io/instance=llm-proxy \
      --container=llm-proxy \
      -n ${LLM_PROXY_NAMESPACE} \
      --timeout=600 \
      -- bash -c 'test -f /tmp/llm-proxy-source-ready && test -f /opt/app/data/go.mod && test -d /opt/app/data/.git && (nc -z localhost 8080 >/dev/null 2>&1 || (echo > /dev/tcp/localhost/8080) >/dev/null 2>&1) || { echo "llm-proxy source deployment is not ready" >&2; exit 1; }'
  run_llm_proxy_e2e: |-
    cd e2e
    export AGYN_AGENT_IMAGE="${AGYN_AGENT_IMAGE:-ghcr.io/agynio/agent-runtime:v1.0.0}"
    export CODEX_INIT_IMAGE="${CODEX_INIT_IMAGE:-ghcr.io/agynio/agent-init-codex:latest}"
    export AGYN_AGENT_INIT_IMAGE="${AGYN_AGENT_INIT_IMAGE:-${CODEX_INIT_IMAGE}}"
    export AGN_INIT_IMAGE="${AGN_INIT_IMAGE:-ghcr.io/agynio/agent-init-agn:latest}"
    export CLAUDE_INIT_IMAGE="${CLAUDE_INIT_IMAGE:-ghcr.io/agynio/agent-init-claude:latest}"
    export AGN_EXPOSE_INIT_IMAGE="${AGN_EXPOSE_INIT_IMAGE:-ghcr.io/agynio/agent-init-agn:latest}"
    LLM_PROXY_URL=http://llm-proxy-llm-proxy.${LLM_PROXY_NAMESPACE}.svc.cluster.local:8080 \
      devspace run test-e2e --tag svc_llm_proxy

commands:
  test-e2e: |-
    devspace run-pipeline test-e2e $@
  ci-e2e: |-
    devspace run-pipeline ci-e2e $@

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace llm-proxy
      else
        start_dev --disable-pod-replace llm-proxy
        stop_dev llm-proxy
      fi
  test-e2e:
    run: |-
      run_llm_proxy_e2e
  ci-e2e:
    run: |-
      disable_argocd_sync
      patch_deployment
      start_dev --disable-pod-replace llm-proxy
      wait_for_source_deployment
      run_llm_proxy_e2e

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:llm-proxy
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  llm-proxy:
    namespace: ${LLM_PROXY_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: llm-proxy
      app.kubernetes.io/instance: llm-proxy
    containers:
      llm-proxy:
        container: llm-proxy
        command:
          - bash
          - -c
          - |-
            set -eu
            buf generate buf.build/agynio/api \
              --path agynio/api/llm/v1 \
              --path agynio/api/users/v1 \
              --path agynio/api/authorization/v1 \
              --path agynio/api/metering/v1 \
              --path agynio/api/ziti_management/v1 \
              --path agynio/api/identity/v1
            echo ready > /tmp/llm-proxy-source-ready
            exec go run ./cmd/llm-proxy
        env:
          - name: ZITI_ENABLED
            value: "false"
        sync:
          - path: ./:/opt/app/data
            startContainer: true
            excludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "8080"
