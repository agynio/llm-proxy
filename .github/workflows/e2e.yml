name: E2E

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        with:
          tag: svc_llm_proxy
          include_smoke: false
